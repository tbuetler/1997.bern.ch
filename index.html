<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bern.ch – 1997</title>

    <style>
        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: #f5f5f5;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: min(760px, 92vw);
            background: #171717;
            border: 1px solid #2f2f2f;
            border-radius: 10px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .coat {
            margin-bottom: 14px;
        }

        .coat img {
            height: 80px;
            width: auto;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.7rem;
        }

        p {
            margin: 8px 0;
            line-height: 1.5;
        }

        .meta {
            color: #bdbdbd;
            font-size: 0.95rem;
            margin: 4px 0;
        }

        .divider {
            margin: 18px auto;
            width: 60%;
            height: 1px;
            background: #333;
        }

        .cta {
            display: inline-block;
            margin-top: 18px;
            padding: 10px 18px;
            border-radius: 8px;
            background: #f2c400;
            color: #101010;
            text-decoration: none;
            font-weight: 700;
        }

        .cta:hover {
            background: #ffd633;
        }

        .skyline {
            margin-top: 18px;
        }

        .skyline img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            opacity: 0.95;
        }
    </style>
</head>

<body>

<main class="card">

    <div class="coat">
        <img src="wappen_bern.png" alt="Wappen Stadt Bern">
    </div>

    <h1>Restoration of the bern.ch Website (1997)</h1>

    <p>
        This page serves as the <strong>entry point</strong> to the reconstructed
        version of the historical bern.ch website from 1997.
    </p>

    <div class="divider"></div>

    <p class="meta">Restoration author: Tim Bütler</p>
    <p class="meta">Restoration date: 27.04.2026</p>

    <a class="cta" href="bern.ch/index.html">Enter BERN.ch</a>

    <div class="divider"></div>

    <div class="skyline">
        <img src="skyline_bern.png" alt="Skyline Bern">
    </div>

</main>

</body>
</html>
